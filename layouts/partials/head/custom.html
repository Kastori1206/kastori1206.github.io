<!-- Busuanzi 사이트 방문자 카운터 -->
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

<!-- Cloudflare Web Analytics (프로덕션 빌드에서만 로드) -->
{{- if not hugo.IsServer -}}
{{- with .Site.Params.cloudflareAnalyticsToken -}}
<script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "{{ . }}"}'></script>
{{- end -}}
{{- end -}}

<!-- 글별 조회수 (Cloudflare Workers) -->
{{- with .Site.Params.pageviewWorkerUrl -}}
<meta name="pageview-worker-url" content="{{ . }}">
<script>
(function () {
  const WORKER = document.querySelector('meta[name="pageview-worker-url"]')?.content;
  if (!WORKER) return;

  async function getCount(url) {
    const r = await fetch(`${WORKER}/api/pageviews?url=${encodeURIComponent(url)}`);
    return (await r.json()).count ?? 0;
  }
  async function increment(url) {
    const r = await fetch(`${WORKER}/api/pageviews?url=${encodeURIComponent(url)}`, { method: 'POST' });
    return (await r.json()).count ?? 0;
  }

  document.addEventListener('DOMContentLoaded', () => {
    const els = document.querySelectorAll('[data-pageview-url]');
    if (!els.length) return;

    const isArticle = document.body.classList.contains('article-page');

    // 모든 요청을 병렬로 보내고 각각 결과가 오는 대로 바로 표시
    els.forEach(el => {
      const url = el.dataset.pageviewUrl;
      const countEl = el.querySelector('.pageview-count');
      if (!countEl) return;

      const req = (isArticle && url === location.pathname)
        ? increment(url)
        : getCount(url);

      req
        .then(count => { countEl.textContent = count.toLocaleString(); })
        .catch(() => { countEl.textContent = '-'; });
    });
  });
})();
</script>
{{- end -}}
