<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 배경: 네이비 rounded square -->
  <rect width="100" height="100" rx="22" fill="#1B365D"/>
  <!-- 하이라이트 (상단 미세 그라디언트) -->
  <rect width="100" height="50" rx="22" fill="white" fill-opacity="0.06"/>
  <!-- K 글자 -->
  <text
    x="50"
    y="70"
    font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
    font-size="58"
    font-weight="800"
    letter-spacing="-2"
    text-anchor="middle"
    fill="white"
  >K</text>
</svg>
