baseURL = "https://blog.kastori.dev/"
locale = "ko-kr"
title = "kastori"
theme = "stack"
paginate = 10
hasCJKLanguage = true

[params]
    mainSections = ["tech", "til", "log"]
    rssFullContent = true
    cloudflareAnalyticsToken = "89aae11da51b4f1091c43fd9824a54ac"  # Cloudflare Web Analytics 토큰
    pageviewWorkerUrl = "https://pageview.kastori1990.workers.dev"  # Cloudflare Worker URL (예: https://pageview.kastori.workers.dev)

    # SEO
    description = "Spring, JPA, React 등 풀스택 웹 개발 실무 지식을 코드와 함께 정리하는 기술 블로그"
    author = "kastori"
    favicon = "img/favicon.svg"

    [params.footer]
        since = 2026
        customText = '<a href="/privacy/">개인정보처리방침</a>'

    [params.dateFormat]
        published = "2006-01-02"
        lastUpdated = "2006-01-02"

    [params.sidebar]
        compact = false
        emoji = ""
        subtitle = "풀스택 개발자의 기술 블로그"
        avatar = "https://github.com/kastori1206.png"

    [params.article]
        toc = true
        readingTime = true
        headingAnchor = true

        [params.article.license]
            enabled = false

    [params.colorScheme]
        toggle = true
        default = "auto"

    [[params.widgets.homepage]]
        type = "categories"
        [params.widgets.homepage.params]
            limit = 10

    [[params.widgets.homepage]]
        type = "archives"
        [params.widgets.homepage.params]
            limit = 5

    [[params.widgets.homepage]]
        type = "tag-cloud"
        [params.widgets.homepage.params]
            limit = 10

    [[params.widgets.page]]
        type = "toc"

    [params.opengraph.twitter]
        card = "summary_large_image"

    [params.homepage]
        grid = true

    [params.comments]
        enabled = true
        provider = "giscus"

    [params.comments.giscus]
        repo = "kastori1206/kastori1206.github.io"
        repoID = "R_kgDOG0eEcg"
        category = "Announcements"
        categoryID = "DIC_kwDOG0eEcs4C9Zgp"
        mapping = "title"
        lightTheme = "light"
        darkTheme = "dark_dimmed"
        reactionsEnabled = 1
        emitMetadata = 0
        inputPosition = "top"
        lang = "ko"

[menu]
    [[menu.main]]
        identifier = "home"
        name = "Home"
        url = "/"
        weight = 10
        [menu.main.params]
            icon = "home"

    [[menu.main]]
        identifier = "tech"
        name = "Tech"
        url = "/tech/"
        weight = 20
        [menu.main.params]
            icon = "archives"

    [[menu.main]]
        identifier = "til"
        name = "TIL"
        url = "/til/"
        weight = 30
        [menu.main.params]
            icon = "hash"

    [[menu.main]]
        identifier = "log"
        name = "Log"
        url = "/log/"
        weight = 40
        [menu.main.params]
            icon = "infinity"

    [[menu.main]]
        identifier = "tags"
        name = "Tags"
        url = "/tags/"
        weight = 50
        [menu.main.params]
            icon = "tag"

    [[menu.main]]
        identifier = "search"
        name = "Search"
        url = "/search/"
        weight = 60
        [menu.main.params]
            icon = "search"

    [[menu.social]]
        identifier = "github"
        name = "GitHub"
        url = "https://github.com/kastori1206"
        weight = 10
        [menu.social.params]
            Icon = "brand-github"

    [[menu.social]]
        identifier = "notion"
        name = "Portfolio"
        url = "https://kastori-dev.notion.site/"
        weight = 20
        [menu.social.params]
            Icon = "brand-notion"

[[menu.footer]]
    identifier = "privacy"
    name = "개인정보처리방침"
    url = "/privacy/"
    weight = 10

[services]
    [services.googleAnalytics]
        ID = "G-Q49JF8HV72"

[markup]
    [markup.highlight]
        codeFences = true
        guessSyntax = true
        noClasses = false

[outputs]
    home = ["HTML", "RSS"]
